<!doctype html><html><head><meta charset="utf-8"><title>OG</title>
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#04131c}
#bg{position:absolute;inset:0;width:1200px;height:630px;image-rendering:pixelated}
.card{position:absolute;inset:0;display:grid;grid-template-columns:1fr 430px;color:#eaf4f7;font-family:Outfit,sans-serif}
.l{padding:64px 0 56px 72px;display:flex;flex-direction:column}
.k{font:20px/1 Silkscreen,monospace;letter-spacing:.14em;color:#59e4ff;margin:0 0 28px}
.t{font:500 76px/1.02 'Cormorant Garamond',serif;margin:0 0 22px;max-width:640px}
.d{font:64px/1 Silkscreen,monospace;color:#59e4ff;text-shadow:0 0 30px rgba(89,228,255,.45);margin:0}
.s{font:26px/1.35 'Cormorant Garamond',serif;color:rgba(234,244,247,.8);margin:auto 0 0;max-width:600px}
.u{font:16px/1 Silkscreen,monospace;letter-spacing:.1em;color:rgba(234,244,247,.6);margin:18px 0 0}
.r{display:grid;place-items:center;padding:40px 60px 40px 0}
.r img{max-height:540px;max-width:360px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}
.r canvas{width:340px;image-rendering:pixelated}
</style></head><body><canvas id="bg"></canvas><div class="card"><div class="l"><p class="k">The Deep Dive</p><h1 class="t" id="t"></h1><p class="d" id="d"></p><p class="s" id="s"></p><p class="u">deepdivewatches.com</p></div><div class="r" id="r"></div></div>
<script type="module" src="./og.ts"></script></body></html>
